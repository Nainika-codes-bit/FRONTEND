<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <form action="">

        <label for="name">Name:</label>
        <input type="text" name="userName" id="name">

        <br><br>

        <label for="age">Age:</label>
        <input type="age" name="userAge" id="age">

        <br><br>

        <label for="DOB">Date of birth:</label>
        <input type="date" id="DOB" name="userdob">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" name="userEmail" id="email">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" name="userPassword" id="password">

        <br><br>

        <label for="number">Phone no.</label>
        <input type="tel" id="number" name="usernumber">

        <br><br>

        <label for="male">Male:</label>
        <input type="radio" name="gender" id="male" value="male">

        <label for="female">Female:</label>
        <input type="radio" name="geneder" id="female" value="female">

        <label for="other">Other:</label>
        <input type="radio" name="gender" id="other" value="other">

        <br><br>

        <label for="c++">C++</label>
        <input type="checkbox" name="programming" id="c++" value="c++">

        <label for="python">Python</label>
        <input type="checkbox" name="programming" id="python" value="python">

        <label for="java">Java</label>
        <input type="checkbox" name="programming" id="java" value="java">

        <label for="javascript">Javascript</label>
        <input type="checkbox" name="programming" id="javascript" value="javascript">

        <br><br>

        <label for="hobby">Hobby</label>
        <select>
            <option value="Video games">video games</option>
            <option value="art">art</option>
            <option value="singing">singing</option>
            <option value="rubix">rubix</option>
        </select>

        <br><br>

        <label>Feedback</label>

        <br>

        <textarea row=10 col=10></textarea>

        <br><br>

        <button>Clear</button>

        <input type="submit">

    </form>
    
</body>
</html>
